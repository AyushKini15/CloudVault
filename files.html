<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudVault – File Library</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css"></head><body>
<div id="app"></div>
<template id="page">
  <div class="toolbar"><input id="q" type="search" placeholder="Search files by name…">
    <select id="cat"><option value="">All categories</option><option value="image">Images</option><option value="video">Videos</option><option value="document">Documents (PDF)</option></select>
    <select id="sort"><option value="desc">Newest first</option><option value="asc">Oldest first</option></select></div>
  <div class="files" id="list"></div>
  <div class="pager" id="pager"></div>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/env.js"></script><script src="js/supabase-config.js"></script><script src="js/auth.js"></script><script src="js/user-common.js"></script><script src="js/user-files.js"></script></body></html>
