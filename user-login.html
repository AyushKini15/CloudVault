<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudVault – Welcome back</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head><body>
<div class="auth-wrap"><div class="card auth-card"><a class="brand" href="index.html">Cloud<span>Vault</span></a>
<h1 style="margin-top:18px">Welcome back</h1><p class="sub">Sign in to access your files.</p>
<form id="login-form" data-portal="user" novalidate>
<div class="field"><label for="identifier">Username or email</label><input id="identifier" type="text" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><div class="pw-row"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="toggle-pw">Show</button></div></div>
<button class="btn" type="submit">Sign in</button></form>
<div class="auth-links"><a href="#" id="forgot">Forgot password?</a><a href="admin-login.html">Admin login</a><a href="index.html">Home</a></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/env.js"></script><script src="js/supabase-config.js"></script><script src="js/auth.js"></script></body></html>
